<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כאן ועכשיו</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Ccircle cx='17' cy='17' r='17' fill='%237b2d3f'/%3E%3Cg transform='translate(8,8)' stroke='white' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='4' cy='4' r='2.2'/%3E%3Ccircle cx='4' cy='14' r='2.2'/%3E%3Cline x1='16' y1='2' x2='6.2' y2='12.8'/%3E%3Cline x1='11.5' y1='10.8' x2='16' y2='15.5'/%3E%3Cline x1='6.2' y1='5.2' x2='9.5' y2='8.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5efe6; --panel:#fffdf9; --border:#e3d5c8;
    --accent:#7b2d3f; --accent2:#9c3f52; --accent-light:#f3e2e6; --accent-dark:#5c1f2c;
    --text:#2b1a1e; --muted:#6b5a54;
    --paper-bg: repeating-linear-gradient(90deg, rgba(123,45,63,.045) 0px, rgba(123,45,63,.045) 1px, transparent 1px, transparent 40px), var(--bg);
    --ease:cubic-bezier(.22,1,.36,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;font-family:'Rubik','Segoe UI',Arial,sans-serif;color:var(--text);
    background:var(--paper-bg);
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .wrap{width:100%;max-width:380px;text-align:center;animation:cardPop .5s var(--ease-spring);}
  @keyframes cardPop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .mark{width:76px;height:76px;margin:0 auto 18px;filter:drop-shadow(0 8px 20px rgba(123,45,63,.4));}
  h1{font-size:26px;font-weight:800;margin:0 0 6px;}
  p.sub{color:var(--muted);font-size:14.5px;margin:0 0 34px;}
  .choice{
    display:flex;flex-direction:column;gap:14px;
  }
  .choice-btn{
    display:flex;align-items:center;gap:14px;
    background:var(--panel);border:1.5px solid var(--border);border-radius:18px;
    padding:18px 20px;text-decoration:none;color:var(--text);
    box-shadow:0 4px 14px -6px rgba(43,26,30,.12);
    transition:transform .15s var(--ease-spring), box-shadow .2s var(--ease), border-color .2s;
  }
  .choice-btn:active{transform:scale(.97);}
  .choice-btn:hover{border-color:var(--accent);box-shadow:0 8px 22px -8px rgba(123,45,63,.28);}
  .choice-icon{
    width:46px;height:46px;border-radius:14px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:22px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  }
  .choice-text{text-align:right;flex:1;}
  .choice-text .t{font-weight:800;font-size:16px;}
  .choice-text .d{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .choice-arrow{color:var(--muted);font-size:18px;}
  footer{margin-top:30px;font-size:11.5px;color:var(--muted);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <svg viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg"><circle cx="17" cy="17" r="17" fill="#7b2d3f"/><g transform="translate(8,8)" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="4" r="2.2"/><circle cx="4" cy="14" r="2.2"/><line x1="16" y1="2" x2="6.2" y2="12.8"/><line x1="11.5" y1="10.8" x2="16" y2="15.5"/><line x1="6.2" y1="5.2" x2="9.5" y2="8.5"/></g></svg>
    </div>
    <h1>כאן ועכשיו</h1>
    <p class="sub">תספורת בלי לתאם מראש</p>
    <div class="choice">
      <a class="choice-btn" href="customer.html">
        <span class="choice-icon">💇</span>
        <span class="choice-text"><span class="t">אני לקוח/ה</span><span class="d">מחפש/ת ספר עכשיו</span></span>
        <span class="choice-arrow">‹</span>
      </a>
      <a class="choice-btn" href="barber.html">
        <span class="choice-icon">✂️</span>
        <span class="choice-text"><span class="t">אני ספר/ית</span><span class="d">כניסה ללוח הבקרה</span></span>
        <span class="choice-arrow">‹</span>
      </a>
    </div>
    <footer>© כאן ועכשיו</footer>
  </div>
</body>
</html>
