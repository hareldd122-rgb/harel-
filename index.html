<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כאן ועכשיו — ללקוחות</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Ccircle cx='17' cy='17' r='17' fill='%237b2d3f'/%3E%3Cg transform='translate(8,8)' stroke='white' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='4' cy='4' r='2.2'/%3E%3Ccircle cx='4' cy='14' r='2.2'/%3E%3Cline x1='16' y1='2' x2='6.2' y2='12.8'/%3E%3Cline x1='11.5' y1='10.8' x2='16' y2='15.5'/%3E%3Cline x1='6.2' y1='5.2' x2='9.5' y2='8.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5efe6; --panel:#fffdf9; --panel2:#ece1d3; --border:#e3d5c8;
    --accent:#7b2d3f; --accent2:#9c3f52; --accent-light:#f3e2e6; --accent-dark:#5c1f2c;
    --text:#2b1a1e; --muted:#6b5a54; --muted2:#9c8a80;
    --green:#16a34a; --red:#c0392b; --amber:#7b2d3f; --star:#c9a227;
    --radius-sm:12px; --radius:18px; --radius-lg:26px;
    --shadow-sm:0 1px 2px rgba(60,25,30,.08);
    --shadow-md:0 6px 20px -6px rgba(60,25,30,.16), 0 2px 8px -2px rgba(60,25,30,.08);
    --shadow-lg:0 24px 60px -16px rgba(123,45,63,.28);
    --ease:cubic-bezier(.22,1,.36,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --paper-bg: repeating-linear-gradient(90deg, rgba(123,45,63,.045) 0px, rgba(123,45,63,.045) 1px, transparent 1px, transparent 40px), var(--bg);
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;font-family:'Rubik','Segoe UI',Arial,sans-serif;color:var(--text);
    background:var(--paper-bg);
    background-attachment:fixed;
    min-height:100vh;
  }
  .icon{width:1em;height:1em;vertical-align:-0.15em;display:inline-block;flex-shrink:0;}
  .icon-star{color:var(--star);}

  header.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(255,253,249,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:34px;height:34px;flex-shrink:0;filter:drop-shadow(0 3px 8px rgba(123,45,63,.35));}
  header.topbar .logo{font-weight:800;font-size:17px;color:var(--text);line-height:1.2;}
  header.topbar .logo span{color:var(--muted);font-weight:400;font-size:11.5px;display:block;}
  .conn-tag{font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;transition:background .25s var(--ease),color .25s var(--ease);}
  .conn-tag.live{background:rgba(22,163,74,.12);color:var(--green);}
  .conn-tag.offline{background:rgba(192,57,43,.1);color:var(--red);}
  .conn-tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .conn-tag.live .dot{animation:dotPulse 1.6s ease-in-out infinite;}
  .header-actions{display:flex;align-items:center;gap:10px;}
  .menu-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--panel2);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0;transition:background .2s var(--ease);}
  .menu-btn:hover{background:var(--border);}
  .menu-btn svg{width:17px;height:17px;}
  @keyframes dotPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.7);}}

  main{max-width:480px;margin:0 auto;padding:16px;padding-bottom:60px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
  #gmap{height:200px;border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:14px;background:#e8e0d2;box-shadow:var(--shadow-sm);}
  .map-msg{font-size:11.5px;color:var(--muted);text-align:center;margin:-8px 0 14px;}
  h1.section-title{font-size:14.5px;color:var(--muted);margin:20px 2px 12px;font-weight:700;display:flex;align-items:center;gap:6px;letter-spacing:.2px;}

  .hero-search{background:var(--panel);border:1.5px solid var(--accent-light);border-radius:var(--radius-lg);padding:26px 20px 22px;margin-bottom:20px;text-align:center;box-shadow:var(--shadow-md);}
  .hero-search-icon{width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 20px -4px rgba(123,45,63,.45);}
  .hero-search-icon svg{width:26px;height:26px;color:#fff;}
  .hero-search-title{font-size:19px;font-weight:800;margin-bottom:6px;}
  .hero-search-sub{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:16px;padding:0 6px;}
  .btn-hero{font-size:15px;padding:16px;margin-top:14px;}

  .barber-info{flex:1;min-width:0;}
  .barber-info .name{font-weight:700;font-size:15px;}
  .barber-info .meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .barber-info .meta b{color:var(--accent-dark);}
  .btn{border:none;border-radius:var(--radius-sm);padding:11px 16px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s var(--ease-spring), box-shadow .2s var(--ease), background .2s var(--ease), opacity .2s;}
  .btn svg{width:16px;height:16px;flex-shrink:0;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 16px -4px rgba(123,45,63,.45);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-outline{background:var(--panel);border:1px solid var(--border);color:var(--text);}
  .btn-outline:hover{background:var(--panel2);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;}
  .btn-block{width:100%;}
  .row{display:flex;align-items:center;justify-content:space-between;}

  .ring-wrap{position:relative;width:150px;height:150px;margin:2px auto 8px;}
  .ring-wrap svg{transform:rotate(-90deg);width:100%;height:100%;display:block;}
  .ring-bg{stroke:var(--panel2);}
  .ring-fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s linear, stroke .3s;}
  .ring-fg.urgent{stroke:var(--red);}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-center .num{font-size:32px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.5px;}
  .ring-center .lbl{font-size:11px;color:var(--muted);margin-top:3px;text-align:center;padding:0 10px;line-height:1.4;}

  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:600;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
  .dot.accent-dot{background:var(--accent);animation:dotPulse 1.4s ease-in-out infinite;}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px;}
  .divider{height:1px;background:var(--border);margin:14px 0;}
  .note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6;}
  .footer-note{text-align:center;color:var(--muted);font-size:11.5px;padding:16px 0 4px;line-height:1.8;}
  .footer-note a{color:var(--accent2);font-weight:600;text-decoration:none;}

  /* ---------- Onboarding ---------- */
  .onboard-overlay{position:fixed;inset:0;background:var(--paper-bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;animation:scrimIn .35s var(--ease);}
  @keyframes scrimIn{from{opacity:0;}to{opacity:1;}}
  .onboard-card{padding:0;max-width:380px;width:100%;text-align:center;animation:cardPop .45s var(--ease-spring);}
  @keyframes cardPop{from{opacity:0;transform:translateY(24px) scale(.94);}to{opacity:1;transform:translateY(0) scale(1);}}
  .onboard-mark{width:68px;height:68px;margin:0 auto 16px;filter:drop-shadow(0 6px 16px rgba(123,45,63,.4));}
  .onboard-card h2{font-size:20px;margin:0 0 10px;color:var(--text);}
  .onboard-card p{color:var(--muted);font-size:13.5px;margin-bottom:18px;line-height:1.6;}
  .step-list{text-align:right;color:var(--text);font-size:13px;line-height:2.1;margin:0 0 24px;padding-inline-start:20px;}
  .step-list li::marker{color:var(--accent);font-weight:700;}
  .login-input{width:100%;box-sizing:border-box;text-align:center;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:16px;font-weight:700;letter-spacing:1px;color:var(--text);margin-bottom:10px;direction:ltr;}
  .login-input:focus{outline:none;border-color:var(--accent);}
  .login-input.error{border-color:var(--red);}
  .login-error{color:var(--red);font-size:12px;margin:-4px 0 12px;}
  .login-demo-hint{background:var(--accent-light);color:var(--accent-dark);font-size:12.5px;font-weight:700;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px;line-height:1.6;}
  .login-link{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;padding:10px 0 0;}


  /* ---------- Face ID (visual — not wired to real biometrics yet) ---------- */
  .faceid-btn{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 16px;font-family:inherit;font-weight:700;font-size:13px;color:var(--text);cursor:pointer;margin-bottom:10px;}
  .faceid-btn svg{width:18px;height:18px;color:var(--accent-dark);}
  .faceid-note{font-size:11.5px;color:var(--accent-dark);background:var(--accent-light);border-radius:var(--radius-sm);padding:8px 10px;margin:-2px 0 14px;line-height:1.5;}

  /* ---------- Full-screen search mode ---------- */
  body.search-fullscreen header.topbar,
  body.search-fullscreen .footer-note{display:none;}
  body.search-fullscreen main{max-width:none;padding:0;}
  body.search-fullscreen #gmap{position:fixed;inset:0;width:100vw;height:100vh;border-radius:0;border:none;z-index:20;margin:0;}
  body.search-fullscreen .map-msg{display:none;}
  body.search-fullscreen .scrim{position:fixed;left:0;right:0;bottom:0;height:58%;z-index:35;background:linear-gradient(to top, rgba(255,252,247,.98) 40%, rgba(255,252,247,0));pointer-events:none;}
  body.search-fullscreen #dynamicArea{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:480px;margin:0 auto;padding:0 16px 20px;}

  .sheet{background:var(--panel);border-radius:26px 26px 0 0;padding:22px 20px 20px;box-shadow:0 -12px 40px rgba(15,23,42,.18);animation:sheetUp .4s var(--ease);}
  @keyframes sheetUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-handle{width:38px;height:4px;border-radius:999px;background:var(--border);margin:0 auto 16px;}

  .map-radar-anchor{position:absolute;pointer-events:none;}
  .search-radar{position:relative;transform:translate(-50%,-50%);width:110px;height:110px;z-index:30;pointer-events:none;}
  .search-radar .ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--accent);opacity:0;animation:radarPulse 1.8s ease-out infinite;}
  .search-radar .ring:nth-child(2){animation-delay:.6s;}
  .search-radar .ring:nth-child(3){animation-delay:1.2s;}
  .search-radar .core{position:absolute;inset:32%;background:linear-gradient(145deg,var(--accent),var(--accent2));border-radius:50%;box-shadow:0 0 30px rgba(123,45,63,.6);display:flex;align-items:center;justify-content:center;}
  .search-radar .core svg{width:22px;height:22px;color:#fff;}
  @keyframes radarPulse{ 0%{ transform:scale(.3); opacity:.85;} 100%{ transform:scale(2.6); opacity:0;} }

  .accept-pop{animation:acceptPop .5s var(--ease-spring);}
  @keyframes acceptPop{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
  .check-badge{width:38px;height:38px;border-radius:50%;background:rgba(22,163,74,.14);color:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .check-badge svg{width:20px;height:20px;}

  .reviews-panel{margin-top:6px;max-height:0;overflow:hidden;transition:max-height .35s var(--ease);}
  .reviews-panel.open{max-height:400px;}
  .review-item{padding:10px 0;border-bottom:1px solid var(--border);}
  .review-item:last-child{border-bottom:none;}
  .review-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;}
  .review-stars{color:var(--star);font-size:12px;display:flex;gap:1px;}
  .review-comment{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5;}

  /* ---------- Post-haircut rating ---------- */
  .star-picker{display:flex;justify-content:center;gap:8px;margin:6px 0 16px;}
  .star-pick{font-size:30px;cursor:pointer;line-height:1;}
  .star-pick .icon-star{color:var(--border);transition:color .15s var(--ease);}
  .star-pick.sel .icon-star{color:var(--star);}
  .rating-comment{width:100%;min-height:64px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;font-family:inherit;font-size:13.5px;resize:vertical;margin-bottom:14px;box-sizing:border-box;}
  .rating-comment:focus{outline:none;border-color:var(--accent);}

  /* ---------- Skeleton loading ---------- */
  .skeleton{background:linear-gradient(90deg,var(--panel2) 25%,#faf5ea 37%,var(--panel2) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:10px;}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}
  .sk-row{display:flex;gap:12px;align-items:center;margin-bottom:14px;}
  .sk-circle{width:54px;height:54px;border-radius:50%;flex-shrink:0;}
  .sk-lines{flex:1;}
  .sk-line{height:11px;margin-bottom:8px;}

  /* ---------- Toolbar chips: style match ---------- */
  .toolbar-row{display:flex;gap:8px;margin-bottom:12px;}
  .chip-toggle{flex:1;border:1.5px solid var(--border);background:var(--panel);border-radius:var(--radius-sm);padding:10px 6px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);transition:all .2s var(--ease);}
  .chip-toggle svg{width:18px;height:18px;}
  .chip-toggle.style-active{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-light);}
  .specialty-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-light);color:var(--accent-dark);margin:6px 4px 0 0;}
  .style-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-light);color:var(--accent-dark);}

  /* ---------- Confirmed-barbers picker (capped list, photo cards, expandable details) ---------- */
  .confirmed-list{max-height:50vh;overflow-y:auto;margin:0 -4px 4px;padding:0 4px;}
  .barber-pick-card{background:var(--panel2);border-radius:16px;padding:14px;margin-bottom:12px;}
  .barber-pick-card:last-child{margin-bottom:0;}
  .barber-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(145deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:19px;flex-shrink:0;}
  .dismiss-btn{width:26px;height:26px;border-radius:50%;border:none;background:transparent;color:var(--muted2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;}
  .dismiss-btn svg{width:13px;height:13px;}
  .dismiss-btn:hover{background:var(--border);color:var(--text);}
  .details-toggle{background:none;border:none;padding:0;margin-top:6px;font-size:12px;font-weight:700;color:var(--accent-dark);display:inline-flex;align-items:center;gap:4px;cursor:pointer;}
  .details-toggle svg{width:10px;height:10px;transform:rotate(-90deg);transition:transform .2s;}
  .details-toggle.open svg{transform:rotate(90deg);}
  .barber-details-panel{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
  .barber-bio{font-size:12.5px;color:var(--text);line-height:1.5;margin:0 0 8px;}
  .barber-details-row{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-bottom:8px;}
  .barber-details-row svg{width:13px;height:13px;flex-shrink:0;}
  .mini-review{font-size:12px;color:var(--muted);margin-bottom:5px;line-height:1.4;}
  .mini-review:last-child{margin-bottom:0;}

  /* ---------- Modal overlays (style match + barber match deck) ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);z-index:110;display:flex;align-items:flex-end;justify-content:center;animation:scrimIn .3s var(--ease);}
  .modal-sheet{position:relative;background:var(--panel);border-radius:26px 26px 0 0;padding:20px 18px;max-width:480px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 -12px 40px rgba(15,23,42,.2);animation:sheetUp .35s var(--ease);}
  .modal-sheet h3{margin:0 0 4px;font-size:16px;}
  .modal-sheet .sub{font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.5;}
  .style-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .style-opt{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;cursor:pointer;transition:all .2s var(--ease);background:var(--panel);}
  .style-opt svg{width:22px;height:22px;color:var(--accent);margin-bottom:6px;}
  .style-opt.sel{border-color:var(--accent);background:var(--accent-light);box-shadow:0 0 0 3px rgba(123,45,63,.12);}
  .style-opt .lbl{font-size:12px;font-weight:700;}
  .upload-box{border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:16px;text-align:center;margin-bottom:14px;cursor:pointer;color:var(--muted);font-size:12.5px;display:block;}
  .upload-preview{width:100%;max-height:180px;object-fit:cover;border-radius:var(--radius-sm);display:block;margin-bottom:10px;}
  .match-score{text-align:center;font-size:13px;font-weight:700;color:var(--accent-dark);margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:6px;}
  .modal-close{position:absolute;left:16px;top:16px;width:30px;height:30px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);}

  /* ---------- Account drawer (slides in from the side) ---------- */
  .drawer-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);z-index:120;animation:scrimIn .25s var(--ease);}
  .drawer-panel{position:fixed;top:0;right:0;bottom:0;width:86%;max-width:340px;background:var(--panel);box-shadow:-16px 0 40px rgba(15,23,42,.25);padding:20px 18px;overflow-y:auto;animation:drawerIn .3s var(--ease);}
  @keyframes drawerIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
  .drawer-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .drawer-title{font-size:17px;font-weight:800;}
  .drawer-close{width:30px;height:30px;border-radius:50%;background:var(--panel2);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);padding:0;flex-shrink:0;}
  .drawer-close svg{width:15px;height:15px;}
  .menu-profile-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .menu-profile-avatar-wrap{position:relative;flex-shrink:0;}
  .menu-profile-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;background-size:cover;background-position:center;}
  .menu-profile-avatar svg{width:22px;height:22px;}
  .avatar-edit-badge{position:absolute;bottom:-2px;left:-2px;width:20px;height:20px;border-radius:50%;background:var(--panel);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;color:var(--muted);padding:0;}
  .avatar-color-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
  .avatar-color-swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;padding:0;}

    <svg viewBox="0 0 ${RING_SIZE} ${RING_SIZE}">

      <circle id="cdRing" class="ring-fg${urgent?' urgent':''}" cx="${RING_SIZE/2}" cy="${RING_SIZE/2}" r="${RING_R}" stroke-width="${RING_STROKE}" fill="none" stroke-dasharray="${RING_C}" stroke-dashoffset="${offset}"/>
    </svg>
    <div class="ring-center"><div class="num" id="cdText">${fmt(remaining)}</div><div class="lbl">${label}</div></div>
  </div>`;
}
function updateRing(remaining, total){
  const ring = document.getElementById('cdRing');
  const text = document.getElementById('cdText');
  if(!ring || !text) return;
  const pct = Math.max(0, Math.min(1, remaining/total));
  ring.style.strokeDashoffset = RING_C * (1-pct);
  ring.classList.toggle('urgent', remaining < 60);
  text.textContent = fmt(remaining);
}

/* ---------- Login (phone + verification code) ---------- */
function isLoggedIn(){ return !!localStorage.getItem(LOCAL_KEYS.LOGIN_PHONE); }
function loggedInPhone(){
  const digits = localStorage.getItem(LOCAL_KEYS.LOGIN_PHONE);
  if(!digits) return DEMO_CUSTOMER_PHONE;
  return digits.slice(0,3)+'-'+digits.slice(3);
}

function normalizePhone(v){ return (v||'').replace(/[^\d]/g,''); }
function genCode(){ return String(Math.floor(1000+Math.random()*9000)); }

function submitPhone(){
  const raw = document.getElementById('loginPhoneInput').value;
  const digits = normalizePhone(raw);
  if(!/^05\d{8}$/.test(digits)){
    loginPhoneError = true;
    render();
    return;
  }
  loginPhoneError = false;
  localStorage.setItem('ta24_pending_phone', digits);
  loginGeneratedCode = genCode();
  loginCodeError = false;
  loginStep = 'code';
  render();
}
function verifyCode(){
  const entered = normalizePhone(document.getElementById('loginCodeInput').value);
  if(entered !== loginGeneratedCode){
    loginCodeError = true;
    render();
    return;
  }
  const phone = localStorage.getItem('ta24_pending_phone') || DEMO_CUSTOMER_PHONE;
  localStorage.setItem(LOCAL_KEYS.LOGIN_PHONE, phone);
  loginStep = 'phone';
  loginGeneratedCode = null;
  loginCodeError = false;
  render();
}
function resendCode(){
  loginGeneratedCode = genCode();
  loginCodeError = false;
  render();
}
function changePhoneNumber(){
  loginStep = 'phone';
  loginGeneratedCode = null;
  loginCodeError = false;
  render();
}
function goToWelcomeStep(){
  loginStep = 'welcome';
  faceIdNoteShown = false;
  loginPhoneError = false;
  signupError = '';
  emailCodeError = false;
  pendingSignup = null;
  render();
}

  loginStep = 'phone';

  loginStep = 'signup';

function showSignupError(msg){
  // Updates the error message in place instead of calling render() — a full re-render
  // would rebuild the signup form from scratch and wipe whatever was typed into the OTHER
  // fields, since they're plain uncontrolled inputs with no state backing them until submit.
  signupError = msg;
  const el = document.getElementById('signupErrorMsg');
  if(el){ el.textContent = msg; el.style.display = msg ? '' : 'none'; }
}
function submitSignup(){
  const first = document.getElementById('signupFirstNameInput').value.trim();
  const last = document.getElementById('signupLastNameInput').value.trim();
  const email = document.getElementById('signupEmailInput').value.trim();
  const birthdate = document.getElementById('signupBirthdateInput').value.trim();
  if(!first || !last){ showSignupError('נא להזין שם פרטי ושם משפחה'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showSignupError('כתובת אימייל לא תקינה'); return; }
  const age = ageFromBirthdate(birthdate);
  if(!birthdate || age===null || age<1 || age>120){ showSignupError('נא להזין תאריך לידה תקין'); return; }
  signupError = '';
  pendingSignup = { first, last, email, birthdate };
  loginGeneratedCode = genCode();
  emailCodeError = false;
  loginStep = 'emailCode';
  render();
}
function verifyEmailCode(){
  const entered = normalizePhone(document.getElementById('emailCodeInput').value);
  if(entered !== loginGeneratedCode){
    emailCodeError = true;
    render();
    return;
  }
  const fullName = [pendingSignup.first, pendingSignup.last].filter(Boolean).join(' ');
  localStorage.setItem(LOCAL_KEYS.CUSTOMER_NAME, fullName);
  localStorage.setItem(LOCAL_KEYS.CUSTOMER_EMAIL, pendingSignup.email);
  localStorage.setItem(LOCAL_KEYS.CUSTOMER_BIRTHDATE, pendingSignup.birthdate);
  localStorage.setItem(LOCAL_KEYS.LOGIN_PHONE, normalizePhone(DEMO_CUSTOMER_PHONE));
  loginStep = 'success';
  render();
}
function resendEmailCode(){
  loginGeneratedCode = genCode();
  emailCodeError = false;
  render();
}
function proceedAfterSuccess(){
  loginStep = 'welcome';

}

function handleAvatarPhotoUpload(input){
  const file = input.files && input.files[0];

    render();

  reader.readAsDataURL(file);

function syncHeaderAvatar(){
  const btn = document.getElementById('headerAvatarBtn');
  const icon = document.getElementById('headerAvatarIcon');
  if(!btn || !icon) return;
  const photo = localStorage.getItem(LOCAL_KEYS.AVATAR_PHOTO);
  const color = localStorage.getItem(LOCAL_KEYS.AVATAR_COLOR);
  icon.style.color = localStorage.getItem(LOCAL_KEYS.AVATAR_ICON_COLOR) || '';
  if(photo){
    btn.style.backgroundImage = `url('${photo}')`;
    btn.style.backgroundSize = 'cover';
    btn.style.backgroundPosition = 'center';
    icon.style.display = 'none';
  } else if(color){
    btn.style.backgroundImage = 'none';
    btn.style.background = color;
    icon.style.display = '';
  } else {
    btn.style.backgroundImage = 'none';
    btn.style.background = '';
    icon.style.display = '';
  }
}

function getSavedCards(){
  let data;
  try{ data = JSON.parse(localStorage.getItem(LOCAL_KEYS.CARD_INFO) || 'null'); }
  catch(e){ return []; }
  if(!data) return [];
  return Array.isArray(data) ? data : [data];
}
function removeCard(index){
  const cards = getSavedCards();
  cards.splice(index, 1);
  localStorage.setItem(LOCAL_KEYS.CARD_INFO, JSON.stringify(cards));
  render();
}
function cardBrandGuess(firstDigit){
  if(firstDigit==='4') return 'Visa';
  if(firstDigit==='5') return 'Mastercard';
  return 'כרטיס אשראי';
}
function formatCardNumberInput(input){
  const digits = input.value.replace(/\D/g,'').slice(0,19);
  input.value = digits.replace(/(.{4})/g,'$1 ').trim();
}
function formatCardExpiryInput(input){
  const digits = input.value.replace(/\D/g,'').slice(0,4);
  input.value = digits.length>2 ? digits.slice(0,2)+'/'+digits.slice(2) : digits;
}
function showCardFormError(msg){
  // Same reasoning as showSignupError(): update in place, don't call render() and wipe
  // whatever the customer already typed into the other card fields.
  cardFormError = msg;
  const el = document.getElementById('cardFormErrorMsg');
  if(el){ el.textContent = msg; el.style.display = msg ? '' : 'none'; }
}
function submitCardForm(){
  const digits = (document.getElementById('cardNumberInput').value||'').replace(/\D/g,'');
  const exp = (document.getElementById('cardExpiryInput').value||'').trim();
  const cvv = (document.getElementById('cardCvvInput').value||'').replace(/\D/g,'');
  const name = (document.getElementById('cardNameInput').value||'').trim();
  if(digits.length<13 || digits.length>19){ showCardFormError('מספר כרטיס לא תקין'); return; }
  if(!/^\d{2}\/\d{2}$/.test(exp)){ showCardFormError('תוקף לא תקין (MM/YY)'); return; }
  if(cvv.length<3 || cvv.length>4){ showCardFormError('קוד CVV לא תקין'); return; }
  if(!name){ showCardFormError('נא להזין את שם בעל/ת הכרטיס'); return; }
  const cards = getSavedCards();
  cards.push({ last4: digits.slice(-4), brand: cardBrandGuess(digits[0]), expiry: exp, name });
  localStorage.setItem(LOCAL_KEYS.CARD_INFO, JSON.stringify(cards));
  cardFormOpen = false;
  cardFormError = '';
  render();
}

/* ---------- Confirm-arrival chime: a short self-contained tone, no external audio file ---------- */
let audioCtx = null;
function ensureAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
  return audioCtx;
}
function playConfirmSound(){
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  const now = ctx.currentTime;
  [880, 1175].forEach((freq, i)=>{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const start = now + i*0.11;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.18, start+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, start+0.28);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start);
    osc.stop(start+0.3);
  });
}
let confirmSoundState = { reqId:null, seen:new Set() };
function checkConfirmSound(active){
  if(!active || active.status!=='pending'){
    confirmSoundState = { reqId:null, seen:new Set() };
    return;
  }
  const dismissed = active.dismissedBarberIds || {};
  const currentIds = Object.keys(active.confirmedBarberIds||{}).filter(id=>!dismissed[id]);
  if(confirmSoundState.reqId !== active.id){
    confirmSoundState = { reqId:active.id, seen:new Set(currentIds) };
    return;
  }
  const isNew = currentIds.some(id=>!confirmSoundState.seen.has(id));
  currentIds.forEach(id=>confirmSoundState.seen.add(id));
  if(isNew) playConfirmSound();
}

function submitRating(reqId, barberId){
  if(!ratingStars) return;
  const stars = ratingStars;
  const input = document.getElementById('ratingComment');
  const comment = input ? input.value.trim() : '';
  db.ref('barbers/'+barberId+'/reviewsList').push({ name:'לקוח', rating:stars, comment, ts:nowSec() });
  db.ref('barbers/'+barberId).transaction(b=>{
    if(!b) return b;
    const oldReviews = b.reviews||0;
    const oldRating = b.rating||0;
    const newReviews = oldReviews+1;
    b.reviews = newReviews;
    b.rating = Math.round(((oldRating*oldReviews + stars)/newReviews)*10)/10;
    return b;
  });
  db.ref('requests/'+reqId).update({ rated:true });
  ratingStars = 0;
  render();
}

function showSearchRadar(){
  if(!gmap || typeof google === 'undefined') return;
  if(!SearchRadarOverlayClass){
    SearchRadarOverlayClass = class extends google.maps.OverlayView {
      constructor(position){ super(); this.position = position; this.div = null; }
      onAdd(){
        this.div = document.createElement('div');
        this.div.className = 'map-radar-anchor';
        this.div.innerHTML = `<div class="search-radar"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="core">${ICONS.scissors}</div></div>`;
        this.getPanes().overlayMouseTarget.appendChild(this.div);

      draw(){
        if(!this.div) return;
        const proj = this.getProjection();
        const pt = proj && proj.fromLatLngToDivPixel(this.position);
        if(!pt) return;
        this.div.style.left = pt.x + 'px';
        this.div.style.top = pt.y + 'px';
      }
      onRemove(){ if(this.div){ this.div.remove(); this.div = null; } }
      setPosition(pos){ this.position = pos; this.draw(); }
    };
  }
  if(!searchRadarOverlay){
    searchRadarOverlay = new SearchRadarOverlayClass(customerMapPosition());
    searchRadarOverlay.setMap(gmap);

/* ---------- Live tracking: animate barber's marker toward customer ---------- */
function metersBetween(a,b){
  const R=6371000;
  const dLat=(b.lat-a.lat)*Math.PI/180;
  const dLng=(b.lng-a.lng)*Math.PI/180;
  const la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function bearingDeg(a,b){
  const la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
  const dLng=(b.lng-a.lng)*Math.PI/180;
  const y=Math.sin(dLng)*Math.cos(la2);
  const x=Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dLng);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function updateEnRoute(active, barber){
  if(!gmap || typeof google === 'undefined') return '…';
  if(!enRouteData || enRouteData.reqId !== active.id){
    const start = {lat:barber.lat, lng:barber.lng};
    const end = meMarker ? {lat:meMarker.getPosition().lat(), lng:meMarker.getPosition().lng()} : DEFAULT_CUSTOMER_POS;
    enRouteData = {reqId:active.id, start, end};
    if(enRouteMarker) enRouteMarker.setMap(null);
    enRouteMarker = new google.maps.Marker({
      position:start, map:gmap, zIndex:999, title:`${barber.name} בדרך אליך`,
      icon:{ path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW, scale:6.5, fillColor:'#f59e0b', fillOpacity:1, strokeColor:'#7c2d12', strokeWeight:1.5, rotation:bearingDeg(start,end) }
    });
  }
  const total = ARRIVAL_WINDOW_SEC;
  const elapsed = nowSec() - active.acceptedAt;
  const t = Math.max(0, Math.min(1, elapsed/total));
  const lat = enRouteData.start.lat + (enRouteData.end.lat-enRouteData.start.lat)*t;
  const lng = enRouteData.start.lng + (enRouteData.end.lng-enRouteData.start.lng)*t;
  if(enRouteMarker) enRouteMarker.setPosition({lat,lng});
  const remainMeters = metersBetween({lat,lng}, enRouteData.end);
  return (remainMeters/1000).toFixed(1);
}

  }
  const onboarded = !!localStorage.getItem(LOCAL_KEYS.ONBOARDED);
  if(!onboarded){
    document.body.classList.remove('search-fullscreen');
    document.getElementById('staticArea').innerHTML = '';
    document.querySelector('.scrim').style.display = 'none';
    document.getElementById('dynamicArea').innerHTML = renderOnboarding();
    return;
  }
  if(!firebaseReady){
    document.getElementById('dynamicArea').innerHTML = renderSkeleton();
    return;
  }

  document.body.classList.toggle('search-fullscreen', !!active);
  document.querySelector('.scrim').style.display = active ? 'block' : 'none';
  if(active){
    ensureStaticArea();
  } else if(document.getElementById('gmap')){
    document.getElementById('staticArea').innerHTML = '';
    gmap = null;
    markerObjs = {};
    meMarker = null;
    decorativeMarkerObjs = [];
    if(searchRadarOverlay){ searchRadarOverlay.setMap(null); searchRadarOverlay = null; }
  }
  document.getElementById('dynamicArea').innerHTML = renderCustomer(active);
  if(active) renderMarkers();
  syncSearchRadar();
  if(active && active.status==='accepted' && barberForChat){
    const remainKm = updateEnRoute(active, barberForChat);
    const leftSec = ARRIVAL_WINDOW_SEC-(nowSec()-active.acceptedAt);
    updateEnRouteLabel(remainKm, Math.max(0,Math.ceil(leftSec/60)));
  } else {
    clearEnRoute();
  }
  if(chatOpen) scrollChatToBottom();
  if(gmap) setTimeout(()=> google.maps.event.trigger(gmap, 'resize'), 0);
}

function tick(){
  const sig = computeSignature();
  if(sig !== lastSignature){ render(); return; }
  const active = myActiveRequest();
  if(!active) return;
  if(active.status==='pending'){
    updateRing(CONFIRM_WINDOW_SEC-(nowSec()-active.createdAt), CONFIRM_WINDOW_SEC);
  } else if(active.status==='accepted'){
    updateRing(ARRIVAL_WINDOW_SEC-(nowSec()-active.acceptedAt), ARRIVAL_WINDOW_SEC);
    const b = getBarbersArr().find(x=>x.id===active.acceptedBarberId);
    if(b){
      const remainKm = updateEnRoute(active, b);
      const leftSec = ARRIVAL_WINDOW_SEC-(nowSec()-active.acceptedAt);
      updateEnRouteLabel(remainKm, Math.max(0,Math.ceil(leftSec/60)));
    }
  }
}

function renderBarberPickCard(active, b){
  const open = openBarberDetailsId === b.id;
  return `
    <div class="barber-pick-card">
      <div class="row" style="gap:12px;align-items:flex-start">
        <div class="barber-avatar">${b.name[0]}</div>
        <div style="flex:1;min-width:0">
          <div class="row" style="gap:8px">
            <div style="font-weight:700">${b.name}</div>
            <button class="dismiss-btn" onclick="dismissBarber('${active.id}','${b.id}')" title="לא מתאים לי">${ICONS.close}</button>
          </div>
          <div style="font-size:12.5px;color:var(--muted)">${ICONS.star} ${b.rating} (${b.reviews}) · ${b.distanceKm} ק"מ · <b style="color:var(--accent-dark)">₪${b.price}</b></div>
          <button class="details-toggle ${open?'open':''}" onclick="toggleBarberDetails('${b.id}')">${ICONS.chev} ${open?'הסתר פרטים':'פרטים נוספים'}</button>
          ${open ? renderBarberDetailsPanel(b) : ''}
        </div>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:12px" onclick="chooseBarber('${active.id}','${b.id}')">בחר/י את ${b.name.split(' ')[0]}</button>
    </div>`;
}
function renderBarberDetailsPanel(b){
  const revs = Object.values(b.reviewsList||{}).sort((r1,r2)=>(r2.ts||0)-(r1.ts||0)).slice(0,2);
  return `
    <div class="barber-details-panel">
      ${b.bio ? `<p class="barber-bio">${escapeHtml(b.bio)}</p>` : ''}
      ${b.address ? `<div class="barber-details-row">${ICONS.nav} ${escapeHtml(b.address)}</div>` : ''}
      ${(b.specialties||[]).length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${b.specialties.map(s=>`<span class="style-badge">${escapeHtml(s)}</span>`).join('')}</div>` : ''}
      ${revs.length ? revs.map(r=>`<div class="mini-review">${ICONS.star} ${r.rating} · ${escapeHtml(r.name||'')} — "${escapeHtml(r.comment||'')}"</div>`).join('') : `<div class="mini-review">עדיין אין ביקורות</div>`}
    </div>`;
}
function renderCustomer(active){
  const barbers = getBarbersArr();

  if(active){
    if(active.status==='pending'){
      const left = CONFIRM_WINDOW_SEC - (nowSec()-active.createdAt);
      const dismissedIds = active.dismissedBarberIds || {};
      const confirmedBarbers = Object.entries(active.confirmedBarberIds||{})
        .filter(([id])=>!dismissedIds[id])
        .sort((a,b)=>(Number(a[1])||0)-(Number(b[1])||0))
        .map(([id])=>barbers.find(b=>b.id===id))
        .filter(Boolean);
      const MAX_VISIBLE_BARBERS = 3;
      const visibleBarbers = confirmedBarbers.slice(0, MAX_VISIBLE_BARBERS);
      const queuedCount = confirmedBarbers.length - visibleBarbers.length;
      if(visibleBarbers.length > 0){
        return `
          <div class="sheet">
            <div class="sheet-handle"></div>
            <div class="status-pill"><span class="dot accent-dot"></span> ${confirmedBarbers.length} ספרים מוכנים לקחת אותך — בחר/י!</div>
            ${(active.stylePreference || active.beardPreference) ? `<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
              ${active.stylePreference?`<span class="style-badge">${ICONS.wand} ${(STYLE_OPTIONS.find(s=>s.id===active.stylePreference)||{}).label||''}</span>`:''}
              ${active.beardPreference?`<span class="style-badge">${active.beardPreference==='with'?'🧔 עם זקן':'🚫 בלי זקן'}</span>`:''}
            </div>` : ''}
            <div class="note" style="margin-top:0">אפשר לבחור עכשיו, או להמתין לעוד הצעות (${fmt(left)})</div>
            <div class="divider"></div>
            <div class="confirmed-list">
              ${visibleBarbers.map(b=>renderBarberPickCard(active, b)).join('')}
            </div>
            ${queuedCount > 0 ? `<div class="note" style="margin-top:0">+${queuedCount} ספרים נוספים ממתינים בתור — ${queuedCount===1?'יופיע':'יופיעו'} אם תסיר/י אחד מהרשימה</div>` : ''}
            <button class="btn btn-outline btn-block" onclick="cancelRequest('${active.id}')">ביטול חיפוש</button>
          </div>`;
      }
      return `
        <div class="sheet">
          <div class="sheet-handle"></div>
          <div class="status-pill"><span class="dot accent-dot"></span> מחפש ספר פנוי בקרבתך…</div>
          ${(active.stylePreference || active.beardPreference) ? `<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
            ${active.stylePreference?`<span class="style-badge">${ICONS.wand} ${(STYLE_OPTIONS.find(s=>s.id===active.stylePreference)||{}).label||''}</span>`:''}
            ${active.beardPreference?`<span class="style-badge">${active.beardPreference==='with'?'🧔 עם זקן':'🚫 בלי זקן'}</span>`:''}
          </div>` : ''}
          ${ringSVG(left, CONFIRM_WINDOW_SEC, `הבקשה נשלחה ל-${(active.targetBarberIds||[]).length} ספרים`)}
          <button class="btn btn-outline btn-block" onclick="cancelRequest('${active.id}')">ביטול חיפוש</button>
        </div>`;
    }
    if(active.status==='accepted'){
      const b = barbers.find(x=>x.id===active.acceptedBarberId);
      if(!b) return `<div class="card empty">טוען…</div>`;
      const left = ARRIVAL_WINDOW_SEC - (nowSec()-active.acceptedAt);
      const revs = Object.values(b.reviewsList||{}).sort((r1,r2)=>(r2.ts||0)-(r1.ts||0));
      const chatMsgs = getChatArr();
      const chatUnread = !chatOpen ? chatMsgs.filter(m=>m.sender==='barber' && m.ts > chatLastSeenTs).length : 0;
      return `
        <div class="card accept-pop">
          <div class="row" style="margin-bottom:12px">
            <div class="status-pill" style="margin-bottom:0"><span class="check-badge">${ICONS.check}</span> הספר אישר!</div>
          </div>
          <div class="enroute-pill">${ICONS.nav} הספר בדרך אליך — <b id="enRouteKm">…</b> ק"מ · מגיע בעוד <b id="enRouteEta">…</b> דק'</div>
          ${ringSVG(left, ARRIVAL_WINDOW_SEC, `זמן עד לחיוב איחור (מחיר מלא)`)}
          ${(active.stylePreference || active.beardPreference) ? `<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;justify-content:center">
            ${active.stylePreference?`<span class="style-badge">${ICONS.wand} ${(STYLE_OPTIONS.find(s=>s.id===active.stylePreference)||{}).label||''}</span>`:''}
            ${active.beardPreference?`<span class="style-badge">${active.beardPreference==='with'?'🧔 עם זקן':'🚫 בלי זקן'}</span>`:''}
          </div>` : ''}
          <div class="row"><div class="barber-info"><div class="name">${b.name}</div><div class="meta">${b.address?b.address+' · ':''}₪${b.price}</div></div></div>
          <div class="divider"></div>
          <div style="display:flex;gap:10px">
            <a class="btn btn-primary" style="flex:1;text-align:center" href="https://waze.com" target="_blank" rel="noopener">${ICONS.nav} ניווט בוויז</a>
            <button class="btn btn-outline" style="flex:1" onclick="toggleReviews()">${ICONS.star} ${b.rating} · ביקורות</button>
          </div>
          <div style="display:flex;gap:10px;margin-top:10px">
            ${b.phone ? `<a class="btn btn-outline" style="flex:1;text-align:center" href="tel:${b.phone}">${ICONS.phone} התקשר</a>` : ''}
            <button class="btn btn-outline" style="flex:1;position:relative" onclick="openChat('${active.id}')">${ICONS.chat} צ'אט${chatUnread>0?` <span class="chat-badge">${chatUnread}</span>`:''}</button>
          </div>
          <div class="reviews-panel ${reviewsOpen?'open':''}">${revs.map(r=>`
            <div class="review-item">
              <div class="review-top"><span>${r.name}</span><span class="review-stars">${ICONS.star.repeat(r.rating)}</span></div>
              <div class="review-comment">${r.comment}</div>
            </div>`).join('')}</div>
          <div style="margin-top:14px"><button class="btn btn-outline btn-block" onclick="cancelRequest('${active.id}')">ביטול (עלול לגרור חיוב)</button></div>
        </div>`;
    }
  }

  const onlineCount = barbers.filter(b=>b.isOnline).length;

  const styleLabel = chosenStyle ? (STYLE_OPTIONS.find(s=>s.id===chosenStyle)||{}).label : null;
  const beardLabel = beardPreference==='with' ? 'עם זקן' : (beardPreference==='without' ? 'בלי זקן' : null);
  const searchLabel = !styleLabel ? 'בחר/י סגנון תספורת כדי להמשיך'
    : !beardLabel ? 'בחר/י עם או בלי זקן כדי להמשיך'
    : `${ICONS.scissors} חפש ספר לסגנון "${styleLabel}"`;
  const heroTitle = styleLabel ? `חיפוש לסגנון "${styleLabel}"` : 'מוכנים לתספורת?';

  return `
    <div class="hero-search">
      <div class="hero-search-icon">${ICONS.scissors}</div>
      <div class="hero-search-title">${heroTitle}</div>
      <div class="hero-search-sub">${DECORATIVE_BARBER_COUNT} מספרות מחוברות באזורך · כמה ספרים יאשרו, ואת/ה תבחר/י את זה שהכי מתאים לך</div>
      <div class="toolbar-row">
        <button class="chip-toggle ${chosenStyle?'style-active':''}" onclick="openStyleModal()">${ICONS.wand} ${styleLabel || 'סגנון תספורת'}</button>
      </div>
      <div class="toolbar-row" style="margin-top:8px">
        <button class="chip-toggle ${beardPreference==='with'?'style-active':''}" onclick="setBeardPreference('with')">🧔 עם זקן</button>
        <button class="chip-toggle ${beardPreference==='without'?'style-active':''}" onclick="setBeardPreference('without')">🚫 בלי זקן</button>
      </div>
      <button class="btn btn-primary btn-block btn-hero" ${(onlineCount===0 || !chosenStyle || !beardPreference)?'disabled':''} onclick="startSearch()">${searchLabel}</button>
    </div>`;
}

/* ticking timers (data itself is pushed live by Firebase listeners above) */
setInterval(tick, 1000);
render();
</script>
